name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 0.1.0 (leave empty for a test build only)"
        required: false
        default: ""

permissions:
  contents: write # only used to attach zips to a release on v* tags

jobs:
  macos:
    name: macOS (VST3 + AU, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target CrateCut_VST3 CrateCut_AU CrateCut_Standalone -j 4

      - name: Sign (ad-hoc) and package
        run: |
          ART=build/CrateCut_artefacts/Release
          PKG=dist/CrateCut
          mkdir -p "$PKG"
          for b in "$ART/VST3/CrateCut.vst3" "$ART/AU/CrateCut.component" "$ART/Standalone/CrateCut.app"; do
            codesign --force --deep --sign - "$b"
            ditto "$b" "$PKG/$(basename "$b")"
          done
          cp "packaging/Install CrateCut.command" "packaging/READ ME FIRST.txt" "$PKG/"
          chmod +x "$PKG/Install CrateCut.command"
          # ditto keeps the executable bit and bundle signatures intact inside the zip
          ditto -c -k --keepParent "$PKG" dist/CrateCut-mac.zip

      - uses: actions/upload-artifact@v5
        with:
          name: CrateCut-macOS
          path: dist/CrateCut-mac.zip

      - name: Test the installer
        run: |
          FAKE_HOME=$(mktemp -d)
          echo | HOME="$FAKE_HOME" "dist/CrateCut/Install CrateCut.command"
          codesign --verify --deep --strict "$FAKE_HOME/Library/Audio/Plug-Ins/VST3/CrateCut.vst3"
          codesign --verify --deep --strict "$FAKE_HOME/Library/Audio/Plug-Ins/Components/CrateCut.component"
          codesign --verify --deep --strict "$FAKE_HOME/Applications/CrateCut.app"
          echo "Installer OK"

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/CrateCut_artefacts/Release/AU/CrateCut.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Ccdk Crcu

  tests:
    name: Linux (offline DSP tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl-dev

      - name: Build tests
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRATECUT_BUILD_TESTS=ON
          cmake --build build --target CrateCutTests

      - name: Run tests
        run: ./build/CrateCutTests_artefacts/Release/CrateCutTests test-output

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-renders
          path: test-output/

  release:
    name: Publish GitHub Release
    # For a pushed v* tag, or "Run workflow" with a version filled in - and only
    # once the Mac build (incl. installer test and auval) and the DSP tests pass.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [macos, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: CrateCut-macOS
          path: dist

      - name: Work out the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${INPUT_VERSION#v}"
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.2.3 (got '$INPUT_VERSION')"; exit 1
            fi
            echo "name=v$v" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: CrateCut ${{ steps.tag.outputs.name }}
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/CrateCut-mac.zip
